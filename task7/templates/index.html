<!DOCTYPE html>
<html>

<head>
    <title>
        AI Handwritten Digit Recognition
    </title>

    <style>

        body{
            background:black;
            color:white;
            text-align:center;
            font-family:Arial;
        }

        h1{
            font-size:55px;
            margin-top:20px;
        }

        p{
            font-size:25px;
        }

        canvas{
            background:white;
            border:4px solid white;
            border-radius:10px;
            cursor:crosshair;
        }

        button{
            padding:15px 30px;
            font-size:22px;
            margin:20px 10px;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        #result{
            font-size:35px;
            color:lime;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <h1>
        AI Handwritten Digit Recognition
    </h1>

    <p>
        Draw a number (0–9)
    </p>

    <canvas
        id="canvas"
        width="350"
        height="350">
    </canvas>

    <br>

    <button onclick="predictDigit()">
        Predict
    </button>

    <button onclick="clearCanvas()">
        Clear
    </button>

    <h2 id="result"></h2>

<script>

const canvas =
document.getElementById(
    "canvas"
);

const ctx =
canvas.getContext("2d");

ctx.fillStyle = "white";
ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
);

let drawing = false;

canvas.addEventListener(
    "mousedown",
    () => {
        drawing = true;
    }
);

canvas.addEventListener(
    "mouseup",
    () => {
        drawing = false;
        ctx.beginPath();
    }
);

canvas.addEventListener(
    "mousemove",
    draw
);

function draw(event){

    if(!drawing)
    return;

    ctx.lineWidth = 20;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(
        event.offsetX,
        event.offsetY
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        event.offsetX,
        event.offsetY
    );
}

function clearCanvas(){

    ctx.fillStyle = "white";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    document
    .getElementById(
        "result"
    ).innerHTML = "";
}

function predictDigit(){

    const image =
    canvas.toDataURL();

    fetch(
        "/predict",
        {
            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:
            JSON.stringify({
                image:image
            })
        }
    )

    .then(
        response =>
        response.json()
    )

    .then(
        data => {

            document
            .getElementById(
                "result"
            ).innerHTML =

            "Predicted Digit: "
            + data.digit;
        }
    );
}

</script>

</body>
</html>
